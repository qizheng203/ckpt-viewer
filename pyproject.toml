[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckpt-viewer"
version = "0.2.0"
description = "A role-aware local checkpoint weight health and static quantization risk diagnostic tool."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ckpt_viewer contributors"}
]
keywords = ["checkpoint", "pytorch", "safetensors", "quantization", "streamlit"]
dependencies = [
  "torch>=2.0",
  "numpy>=1.23",
  "pandas>=2.0",
  "plotly>=5.0",
  "streamlit>=1.30",
  "typer>=0.9",
  "rich>=13.0",
  "safetensors>=0.4",
]

[project.scripts]
ckpt-viewer = "ckpt_viewer.cli:main"
ckpt_viewer = "ckpt_viewer.cli:main"
pth-inspector = "ckpt_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ckpt_viewer*"]
